server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: stray-cat-server
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.156.132:3306/stray_cat?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  
  data:
    redis:
      host: 192.168.156.132
      port: 6379
      password: 123456
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.straycat.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.straycat: debug
    com.straycat.mapper: debug

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn

file:
  upload-path: ./uploads

wechat:
  # 密钥只从环境变量或本机/本机外的 config/application.yml 注入，不写进仓库
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}
  msg-sec-check:
    # enabled=false 只在本地联调时关掉；线上必须开着
    enabled: false
    # false：只有 suggest=risky 拦截，review 和接口异常放行并记日志
    # true：review 与接口异常也拦截（提审前建议打开，避免检测接口挂了导致违规内容直接入库）
    strict: false
  # 订阅消息。模板 ID 在小程序后台「功能-订阅消息」申请后填进来，留空=只写站内消息、不调微信接口。
  # 槽位含义（猫咪 / 对方 / 时间或状态）见 util/NotifyTemplates；
  # 「槽位填到哪个字段」由下面的 fields 决定——公共模板库同形状模板的字段序号并不固定。
  subscribe:
    enabled: true
    # trial 体验版 / formal 正式版 / developer 开发版；体验期填 trial，否则用户点进去打不开
    state: ${WX_SUBSCRIBE_STATE:formal}
    templates:
      task-accepted: ${WX_TPL_TASK_ACCEPTED:}
      record-approved: ${WX_TPL_RECORD_APPROVED:}
      record-rejected: ${WX_TPL_RECORD_REJECTED:}
      record-submitted: ${WX_TPL_RECORD_SUBMITTED:}
      adoption-new: ${WX_TPL_ADOPTION_NEW:}
      adoption-approved: ${WX_TPL_ADOPTION_APPROVED:}
      adoption-rejected: ${WX_TPL_ADOPTION_REJECTED:}
      follow-up-due: ${WX_TPL_FOLLOW_UP_DUE:}
      record-pending: ${WX_TPL_RECORD_PENDING:}
      # 共同领养：邀请与回应。没申请模板时留空即可，只落站内消息
      co-adoption-invite: ${WX_TPL_CO_ADOPTION_INVITE:}
      co-adoption-result: ${WX_TPL_CO_ADOPTION_RESULT:}
      # 活动提醒（P2-1）：小程序后台申请到「活动/预约提醒」类模板后填入即激活，留空时整项隐藏
      campaign-reminder: ${WX_TPL_CAMPAIGN_REMINDER:}
      # 寻猫线索（二期 B）：留空即退化为纯站内消息，UAT 不配模板也能完整验收
      lost-cat-clue-new: ${WX_TPL_LOST_CAT_CLUE_NEW:}
    # 每个模板 content 里的字段名，逗号分隔，按位置对应三个槽位。
    # 默认值已按 2026-11-09 线上实际选用的模板填好（用 wxaapi/newtmpl/gettemplate 拉出来的真字段），
    # 换模板时只改这里或对应的 WX_TPL_FIELD_* 环境变量，不要改代码。
    # 注意 phrase 类字段只能填模板自带的枚举值，业务文案塞不进去，选模板时避开。
    fields:
      # 接单提醒（2026-11-13 换模板：任务名称/接单人/接单时间 → thing13/thing10/time11）
      task-accepted: ${WX_TPL_FIELD_TASK_ACCEPTED:thing13,thing10,time11}
      # 打卡提醒（2026-11-13 换模板：打卡名称/打卡人/打卡时间 → thing4/thing10/time9）
      record-submitted: ${WX_TPL_FIELD_RECORD_SUBMITTED:thing6,thing5,time1}
      record-approved: ${WX_TPL_FIELD_RECORD_APPROVED:thing4,thing10,time9}
      record-rejected: ${WX_TPL_FIELD_RECORD_REJECTED:thing4,thing10,time9}
      adoption-new: ${WX_TPL_FIELD_ADOPTION_NEW:thing1,thing2,thing3}
      # 审核结果通知（2026-11-13 换模板：任务名称/申请人/审核结果 → thing20/thing11/phrase1，
      # phrase 限 5 个汉字固定短语，代码传「审核通过/审核未通过」）
      adoption-approved: ${WX_TPL_FIELD_ADOPTION_APPROVED:thing20,thing11,phrase1}
      adoption-rejected: ${WX_TPL_FIELD_ADOPTION_REJECTED:thing20,thing11,phrase1}
      # 访客提醒（2026-11-13 换模板：到访地点/时间/来访事由 → 猫名/领养通过时间/回访阶段）
      follow-up-due: ${WX_TPL_FIELD_FOLLOW_UP_DUE:thing20,time3,thing11}
      record-pending: ${WX_TPL_FIELD_RECORD_PENDING:thing1,thing2,time3}
      # 记账邀请通知（2026-11-13 换模板：邀请人/被邀请人/备注/时间 → thing1/thing2/thing3/time4）
      co-adoption-invite: ${WX_TPL_FIELD_CO_ADOPTION_INVITE:thing1,thing2,thing3,time4}
      # 审核结果通知（2026-11-13 复用领养审核同款：任务名称/申请人/审核结果 → thing20/thing11/phrase1）
      co-adoption-result: ${WX_TPL_FIELD_CO_ADOPTION_RESULT:thing20,thing11,phrase1}
      # 活动提醒：默认按 thing1/thing2/thing3 预留，模板下来后按真实字段名改环境变量
      campaign-reminder: ${WX_TPL_FIELD_CAMPAIGN_REMINDER:thing1,thing2,thing3}
      # 寻猫线索：模板申请下来后按真实字段名改环境变量
      lost-cat-clue-new: ${WX_TPL_FIELD_LOST_CAT_CLUE_NEW:thing1,thing2,thing3}

notify:
  follow-up-reminder:
    # 默认每天 10:10 扫描领养满 30/60/90 天的申请并提醒，线上可在 config/application.yml 覆盖 cron
    # 重复执行靠站内消息判重，改时间点不会重发
    enabled: true
    cron: "0 10 10 * * *"

# 腾讯位置服务 WebAPI（lbs.qq.com 申请）。key 只在服务端，由 /geo/route 代理调用，
# 不下发进小程序包，也不用把 apis.map.qq.com 加进 request 合法域名。
# 留空时 /geo/route 退化为两点直线（source=straight），导航页照常显示直线距离。
# 区域划分功能复用同一把 key：/geo/reverse（逆地理编码）与 /admin/region/sync（区域同步）；
# key 需在腾讯控制台勾选 WebServiceAPI 并授权服务器。留空时区域功能降级为「全部口径不过滤」。
tencent:
  map:
    key: ${TENCENT_MAP_KEY:}
    # walking / driving / bicycling
    mode: walking

# 和风天气（QWeather，2026 新版 v1 API）。公共 API 地址已停用，必须用开发者独立 Host。
# host/key 只从环境变量注入，不写进仓库、不下发小程序包。留空时天气卡片静默隐藏。
# 免费额度：每月前 5 万次请求免费；本项目 30 分钟缓存一次，一天仅几十次。
qweather:
  # 控制台「设置」页分配的独立 API Host，如 h2a9cf3mhs.xy.qweatherapi.com（不带 https://）
  host: ${QWEATHER_HOST:}
  # 控制台「项目管理-凭据」创建的 API Key
  key: ${QWEATHER_KEY:}

# 虚拟支付（道具直购）。app-key / push-token 只存在于服务端，用环境变量注入，不要写死进仓库。
# product-id 与 price-fen 必须和小程序后台「虚拟支付 - 道具管理」里已发布的道具完全一致。
xpay:
  offer-id: ${XPAY_OFFER_ID:}
  app-key: ${XPAY_APP_KEY:}
  push-token: ${XPAY_PUSH_TOKEN:}
  # 0 现网，1 沙箱（iOS 不支持沙箱）
  env: 0
  # 打开后每 5 分钟向微信查单，兜住消息推送丢包
  reconcile-enabled: false
  packs:
    - code: tiny
      product-id: catfood_5
      coin-amount: 5
      price-fen: 10
      title: 5 份猫粮
    - code: small
      product-id: catfood_60
      coin-amount: 60
      price-fen: 100
      title: 60 份猫粮
    - code: medium
      product-id: catfood_320
      coin-amount: 320
      price-fen: 500
      title: 320 份猫粮
    - code: large
      product-id: catfood_680
      coin-amount: 680
      price-fen: 980
      title: 680 份猫粮

# 渠道日报（P1-5）：每天 00:05 汇总昨日分享/新用户发给管理员站内消息
report:
  daily:
    enabled: ${REPORT_DAILY_ENABLED:true}
    cron: ${REPORT_DAILY_CRON:0 5 0 * * *}

# 首页改造（方案 2 / 7）：公共内容缓存 TTL 与内容条数上限
home:
  bootstrap-cache-seconds: 60
  leaderboard-cache-seconds: 300
  hotspot-limit: 3
  board-limit: 5

# 花纹识别一期（方案 5.2.5）：阈值以本服务 app.env 为唯一口径，
# Python 侧 MATCH_THRESHOLD 硬编码且读不到 app.env，Java 忽略其 success/message 自行分级。
# 生产 env 不设 RECOGNIZER_ENABLED 即为 false，灰度安全。
recognizer:
  base-url: ${RECOGNIZER_BASE_URL:http://recognizer:8000}
  enabled: ${RECOGNIZER_ENABLED:false}
  connect-timeout-ms: 2000
  # stats 首次调用需建立 Python->MySQL 连接，5s 偶发误判降级，二期放宽到 8000ms
  read-timeout-ms: 8000
  # match 是用户交互链路：二期实测 Python 冷启动首次 4.8s，2500ms 会误判降级，放宽到 8000ms
  match-timeout-ms: ${RECOGNIZER_MATCH_TIMEOUT_MS:8000}
  # register 是写操作：UAT 实测经 Java 转发约 9.6s，5s 会超时但 Python 仍完成写库，故单独放宽
  register-timeout-ms: ${RECOGNIZER_REGISTER_TIMEOUT_MS:15000}
  match-threshold: ${RECOGNIZER_MATCH_THRESHOLD:0.85}
  manual-threshold: ${RECOGNIZER_MANUAL_THRESHOLD:0.70}
  # 二期：高置信还要求 top1-top2 达到该差值，否则降 medium
  margin-threshold: ${RECOGNIZER_MARGIN_THRESHOLD:0.05}
  top-k: 3
  failure-cooldown-seconds: 30
