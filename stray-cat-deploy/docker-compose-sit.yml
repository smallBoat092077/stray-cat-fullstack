# SIT 环境 Docker Compose 配置
# 端口调整避免与主服务器冲突

services:
  mysql:
    image: mysql:8.0
    container_name: straycat-sit-mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --default-time-zone=+08:00 --max_connections=40
    environment:
      MYSQL_DATABASE: stray_cat
      MYSQL_USER: straycat
    env_file: .env
    volumes:
      - ./mysql:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports: ["3307:3306"]  # SIT 用 3307，避免与主服务器 3306 冲突
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s
    networks: [scnet-sit]

  redis:
    image: redis:7-alpine
    container_name: straycat-sit-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    env_file: .env
    volumes:
      - ./redis:/data
    ports: ["6380:6379"]  # SIT 用 6380
    networks: [scnet-sit]

  app:
    image: eclipse-temurin:21-jre
    container_name: straycat-sit-app
    restart: always
    working_dir: /opt/stray-cat
    volumes:
      - ./app/stray-cat-server-1.0.0.jar:/opt/stray-cat/app/app.jar:ro
      - ./config:/opt/stray-cat/config:ro
      - ./uploads:/opt/stray-cat/uploads
    env_file:
      - .env
      - app.env
    environment:
      TZ: Asia/Shanghai
      # SIT 环境使用不同的数据库和 Redis 端口
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/stray_cat?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports: ["8082:8080"]  # SIT 用 8082
    command: java -Duser.timezone=Asia/Shanghai -Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -jar /opt/stray-cat/app/app.jar
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [scnet-sit]

  web:
    image: nginx:1.25-alpine
    container_name: straycat-sit-web
    restart: always
    ports: ["8083:80", "8444:443"]  # SIT 用 8083/8444
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/webroot:/var/www/html
    depends_on: [app]
    networks: [scnet-sit]

  recognizer:
    build: ./stray-cat-recognizer
    container_name: straycat-sit-recognizer
    restart: always
    ports: ["8002:8000"]  # SIT 用 8002
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks: [scnet-sit]

networks:
  scnet-sit:
    driver: bridge
